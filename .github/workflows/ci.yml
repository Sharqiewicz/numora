name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Includes packages/core/tests/perf.gate.test.ts, which fails if grouping returns to
      # quadratic (the 905ms-on-a-160k-paste regression that shipped undetected).
      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # Runs after Build - reads dist/. Budgets both packages AND the React consumer total,
      # since numora-react externalizes numora and the per-package figure understates real
      # install cost by ~2x.
      - name: Bundle size
        run: pnpm size

      - name: Docs drift
        run: pnpm docs:drift
